name: Build Binaries & Update Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.3). Defaults to package.json version."
        required: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CLI repo
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(jq -r '.version' package.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Building Enver CLI v$VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies & UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx
          bun install

      - name: Compile Standalone Binaries
        run: |
          mkdir -p dist-bin/darwin-arm64 dist-bin/darwin-x64 dist-bin/linux-x64 dist-bin/linux-arm64 dist-bin/windows-x64
          mkdir -p release-assets

          echo "Compiling for macOS Apple Silicon (arm64)..."
          bun build --compile --minify --target=bun-darwin-arm64 ./src/index.ts --outfile ./dist-bin/darwin-arm64/ev

          echo "Compiling for macOS Intel (x64)..."
          bun build --compile --minify --target=bun-darwin-x64 ./src/index.ts --outfile ./dist-bin/darwin-x64/ev

          echo "Compiling for Linux x64..."
          bun build --compile --minify --target=bun-linux-x64 ./src/index.ts --outfile ./dist-bin/linux-x64/ev

          echo "Compiling for Linux arm64..."
          bun build --compile --minify --target=bun-linux-arm64 ./src/index.ts --outfile ./dist-bin/linux-arm64/ev

          echo "Compiling for Windows x64..."
          bun build --compile --minify --target=bun-windows-x64 ./src/index.ts --outfile ./dist-bin/windows-x64/ev.exe

      - name: Compress Linux & Windows Executables with UPX
        run: |
          echo "Compressing Linux and Windows binaries with UPX..."
          upx --best ./dist-bin/linux-x64/ev || true
          upx --best ./dist-bin/linux-arm64/ev || true
          upx --best ./dist-bin/windows-x64/ev.exe || true

      - name: Package Archives & Compute Checksums
        id: hashes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # High compression gzip for macOS and Linux archives
          GZIP=-9 tar -czvf "release-assets/ev-darwin-arm64.tar.gz" -C ./dist-bin/darwin-arm64 ev
          GZIP=-9 tar -czvf "release-assets/ev-darwin-x64.tar.gz" -C ./dist-bin/darwin-x64 ev
          GZIP=-9 tar -czvf "release-assets/ev-linux-x64.tar.gz" -C ./dist-bin/linux-x64 ev
          GZIP=-9 tar -czvf "release-assets/ev-linux-arm64.tar.gz" -C ./dist-bin/linux-arm64 ev
          zip -9 -j "release-assets/ev-windows-x64.zip" ./dist-bin/windows-x64/ev.exe

          cd release-assets
          sha256sum * > checksums.txt

          SHA_DARWIN_ARM64=$(shasum -a 256 ev-darwin-arm64.tar.gz | awk '{print $1}')
          SHA_DARWIN_X64=$(shasum -a 256 ev-darwin-x64.tar.gz | awk '{print $1}')
          SHA_LINUX_X64=$(shasum -a 256 ev-linux-x64.tar.gz | awk '{print $1}')
          SHA_LINUX_ARM64=$(shasum -a 256 ev-linux-arm64.tar.gz | awk '{print $1}')

          echo "sha_darwin_arm64=$SHA_DARWIN_ARM64" >> "$GITHUB_OUTPUT"
          echo "sha_darwin_x64=$SHA_DARWIN_X64" >> "$GITHUB_OUTPUT"
          echo "sha_linux_x64=$SHA_LINUX_X64" >> "$GITHUB_OUTPUT"
          echo "sha_linux_arm64=$SHA_LINUX_ARM64" >> "$GITHUB_OUTPUT"
          cd ..

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Homebrew Tap Repo
        uses: actions/checkout@v4
        with:
          repository: nelson-david/homebrew-enver
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-enver

      - name: Generate Standalone Homebrew Formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_DARWIN_ARM64="${{ steps.hashes.outputs.sha_darwin_arm64 }}"
          SHA_DARWIN_X64="${{ steps.hashes.outputs.sha_darwin_x64 }}"
          SHA_LINUX_ARM64="${{ steps.hashes.outputs.sha_linux_arm64 }}"
          SHA_LINUX_X64="${{ steps.hashes.outputs.sha_linux_x64 }}"
          FORMULA="homebrew-enver/Formula/enver.rb"

          cat > "$FORMULA" << EOF
          class Enver < Formula
            desc "Security-first environment variable orchestrator"
            homepage "https://enver-os.xyz"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/nelson-david/enver-cli/releases/download/v#{version}/ev-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/nelson-david/enver-cli/releases/download/v#{version}/ev-darwin-x64.tar.gz"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/nelson-david/enver-cli/releases/download/v#{version}/ev-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/nelson-david/enver-cli/releases/download/v#{version}/ev-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "ev"
            end

            test do
              system "#{bin}/ev", "--version"
            end
          end
          EOF

          # Fix indentation
          sed -i 's/^          //' "$FORMULA"

          echo "✅ Generated formula:"
          cat "$FORMULA"

      - name: Commit and Push to Tap
        working-directory: homebrew-enver
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/nelson-david/homebrew-enver.git
          git add Formula/enver.rb
          if git diff --staged --quiet; then
            echo "No changes in formula to commit."
          else
            git commit -m "Update enver to v${VERSION} (standalone binary)"
            git push origin HEAD
          fi
